name: Keep database awake

# Supabase free projects pause after a week of no activity.
# This pings the database twice a week so the site content stays online.
on:
  schedule:
    - cron: "17 13 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/posts?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" > /dev/null
